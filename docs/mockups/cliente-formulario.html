<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mockup - Formulario de cliente</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef1f4; margin: 0; color: #333; }
        .nav { height: 52px; background: #444; display: flex; align-items: center; padding: 0 24px; color: #fff; gap: 24px; font-size: 14px; }
        .container { padding: 24px; max-width: 900px; }
        .form { background: #fff; border: 2px solid #ccc; border-radius: 8px; padding: 24px; margin-top: 16px; }
        .row { display: flex; gap: 16px; }
        .field { flex: 1; margin-bottom: 16px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; }
        .input { height: 36px; background: #f4f4f4; border: 1px solid #ccc; border-radius: 4px; }
        .buttons { margin-top: 8px; display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border-radius: 4px; font-size: 14px; }
        .primary { background: #555; color: #fff; }
        .secondary { border: 1px solid #999; color: #555; }
    </style>
</head>
<body>
    <div class="nav"><strong>TRANSPORTES RBL</strong><span>Panel</span><span>Clientes</span><span>Conductores</span><span>Vehículos</span><span>Rutas</span><span>Envíos</span></div>
    <div class="container">
        <h2>Nuevo cliente</h2>
        <div class="form">
            <div class="row">
                <div class="field"><label>Tipo de documento</label><div class="input"></div></div>
                <div class="field"><label>Número de documento</label><div class="input"></div></div>
                <div class="field"><label>Nombre / Razón social</label><div class="input"></div></div>
            </div>
            <div class="row">
                <div class="field"><label>Teléfono</label><div class="input"></div></div>
                <div class="field"><label>Correo electrónico</label><div class="input"></div></div>
                <div class="field"><label>Dirección</label><div class="input"></div></div>
            </div>
            <div class="buttons"><div class="btn primary">GUARDAR</div><div class="btn secondary">CANCELAR</div></div>
        </div>
    </div>
</body>
</html>
