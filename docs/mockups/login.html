<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mockup - Inicio de sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef1f4; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .box { width: 340px; background: #fff; border: 2px solid #ccc; border-radius: 8px; padding: 28px; }
        .logo { height: 48px; background: #ddd; border-radius: 4px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #666; }
        label { display: block; font-size: 13px; margin: 12px 0 4px; }
        .input { height: 36px; background: #f4f4f4; border: 1px solid #ccc; border-radius: 4px; }
        .btn { margin-top: 18px; height: 38px; background: #555; color: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .muted { text-align: center; font-size: 12px; color: #888; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">TRANSPORTES RBL</div>
        <label>Correo electrónico</label>
        <div class="input"></div>
        <label>Contraseña</label>
        <div class="input"></div>
        <div class="btn">INGRESAR</div>
        <div class="muted">admin@transportesrbl.com / password</div>
    </div>
</body>
</html>
